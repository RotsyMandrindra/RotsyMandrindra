name: Profile cards

# Generates the stats, top languages and snake images used in ReadMe.md
# (one light and one dark variant each) and publishes them to the `output` branch.
on:
  schedule:
    - cron: "0 3 * * *" # every day at 03:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/profile-cards.yml

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

env:
  # Palette shared with ReadMe.md: React cyan + violet. Backgrounds are opaque because <picture> follows
  # the browser/OS theme, so a variant can end up on the other theme's page and must stay readable there.
  STATS: show_icons=true&include_all_commits=true&border_radius=10
  LANGS: layout=compact&langs_count=8&card_width=360&border_radius=10
  DARK: bg_color=0D1117&title_color=61DAFB&icon_color=A78BFA&text_color=C9D1D9&border_color=30363D&ring_color=61DAFB
  LIGHT: bg_color=FFFFFF&title_color=0A7EA4&icon_color=7C3AED&text_color=1F2328&border_color=D0D7DE&ring_color=0A7EA4

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # fail_on_error: a rate-limited run fails instead of publishing error cards,
      # so the previous images on the `output` branch stay in place.
      - name: Stats card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&${{ env.STATS }}&${{ env.LIGHT }}
          path: dist/stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Stats card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&${{ env.STATS }}&${{ env.DARK }}
          path: dist/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Top languages card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&${{ env.LANGS }}&${{ env.LIGHT }}
          path: dist/top-langs-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Top languages card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&${{ env.LANGS }}&${{ env.DARK }}
          path: dist/top-langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # one theme-neutral snake: translucent empty cells and violet levels read on both backgrounds
          outputs: |
            dist/snake.svg?color_snake=#EC4899&color_dots=#8C959F40,#C4B5FD,#A78BFA,#8B5CF6,#6D28D9

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
          commit_message: "chore: update profile cards"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
