<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" role="img" aria-label="Let’s build something great together">
  <title>Let’s build something great together</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.6"><stop offset="0" stop-color="#06B6D4"/><stop offset="0.35" stop-color="#3B82F6"/><stop offset="0.7" stop-color="#8B5CF6"/><stop offset="1" stop-color="#EC4899"/></linearGradient>
    <filter id="shadow" x="-10%" y="-30%" width="120%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1E1B4B" flood-opacity="0.35"/>
    </filter>
  </defs>
  <style>
    .title { font: 800 76px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #FFFFFF; }
    .subtitle { font: 600 26px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #FFFFFF; }
    .cta { font: 700 36px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #FFFFFF; }
    .wave { animation: slide linear infinite; }
    .spark { animation: twinkle 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .rise { animation: rise 1s ease-out both; }
    .rise2 { animation: rise 1s ease-out 0.25s both; }
    @keyframes slide { from { transform: translateX(0); } to { transform: translateX(-1200px); } }
    @keyframes twinkle { 0%, 100% { opacity: 0.25; transform: scale(0.7); } 50% { opacity: 0.95; transform: scale(1); } }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="1200" height="180" fill="url(#bg)"/>
  <circle cx="90" cy="27" r="110" fill="#FFFFFF" opacity="0.10"/>
  <circle cx="1130" cy="144" r="140" fill="#FFFFFF" opacity="0.08"/>
  <circle cx="960" cy="22" r="46" fill="#FFFFFF" opacity="0.10"/>
  <path class="spark" style="animation-delay:0.4s" d="M170 103 Q170 115 182 115 Q170 115 170 127 Q170 115 158 115 Q170 115 170 103 Z" fill="#FFFFFF"/>
  <path class="spark" style="animation-delay:1.4s" d="M1030 96 Q1030 110 1044 110 Q1030 110 1030 124 Q1030 110 1016 110 Q1030 110 1030 96 Z" fill="#FFFFFF"/>
  <path class="spark" style="animation-delay:2s" d="M260 142 Q260 150 268 150 Q260 150 260 158 Q260 150 252 150 Q260 150 260 142 Z" fill="#FFFFFF"/>
  <g filter="url(#shadow)"><text class="cta" x="600" y="118" text-anchor="middle" dominant-baseline="middle">Let’s build something great together 🚀</text></g>
  <path class="wave" style="animation-duration:14s;animation-direction:normal" fill="#FFFFFF" fill-opacity="0.3" d="M0 46 Q150 30 300 46 T600 46 T900 46 T1200 46 T1500 46 T1800 46 T2100 46 T2400 46 L2400 0 L0 0 Z"/><path class="wave" style="animation-duration:10s;animation-direction:reverse" fill="#FFFFFF" fill-opacity="0.55" d="M0 34 Q150 21 300 34 T600 34 T900 34 T1200 34 T1500 34 T1800 34 T2100 34 T2400 34 L2400 0 L0 0 Z"/><path class="wave" style="animation-duration:18s;animation-direction:normal" fill="#FFFFFF" fill-opacity="1" d="M0 20 Q150 10 300 20 T600 20 T900 20 T1200 20 T1500 20 T1800 20 T2100 20 T2400 20 L2400 0 L0 0 Z"/>
</svg>
