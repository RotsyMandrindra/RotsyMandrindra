  <path class="wave" style="animation-duration:14s;animation-direction:normal" fill="#FFFFFF" fill-opacity="0.3" d="M0 234 Q150 218 300 234 T600 234 T900 234 T1200 234 T1500 234 T1800 234 T2100 234 T2400 234 L2400 280 L0 280 Z"/><path class="wave" style="animation-duration:10s;animation-direction:reverse" fill="#FFFFFF" fill-opacity="0.55" d="M0 246 Q150 233 300 246 T600 246 T900 246 T1200 246 T1500 246 T1800 246 T2100 246 T2400 246 L2400 280 L0 280 Z"/><path class="wave" style="animation-duration:18s;animation-direction:normal" fill="#FFFFFF" fill-opacity="1" d="M0 260 Q150 250 300 260 T600 260 T900 260 T1200 260 T1500 260 T1800 260 T2100 260 T2400 260 L2400 280 L0 280 Z"/>
