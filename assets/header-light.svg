<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Rotsy Mandrindra — Fullstack Developer · Symfony &amp; React">
  <title>Rotsy Mandrindra — Fullstack Developer · Symfony &amp; React</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.6"><stop offset="0" stop-color="#06B6D4"/><stop offset="0.35" stop-color="#3B82F6"/><stop offset="0.7" stop-color="#8B5CF6"/><stop offset="1" stop-color="#EC4899"/></linearGradient>
    <filter id="shadow" x="-10%" y="-30%" width="120%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1E1B4B" flood-opacity="0.35"/>
    </filter>
  </defs>
  <style>
    .title { font: 800 76px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #FFFFFF; }
    .subtitle { font: 600 26px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #FFFFFF; }
    .cta { font: 700 36px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #FFFFFF; }
    .wave { animation: slide linear infinite; }
    .spark { animation: twinkle 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .rise { animation: rise 1s ease-out both; }
    .rise2 { animation: rise 1s ease-out 0.25s both; }
    @keyframes slide { from { transform: translateX(0); } to { transform: translateX(-1200px); } }
    @keyframes twinkle { 0%, 100% { opacity: 0.25; transform: scale(0.7); } 50% { opacity: 0.95; transform: scale(1); } }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="1200" height="280" fill="url(#bg)"/>
  <circle cx="90" cy="42" r="110" fill="#FFFFFF" opacity="0.10"/>
  <circle cx="1130" cy="224" r="140" fill="#FFFFFF" opacity="0.08"/>
  <circle cx="960" cy="34" r="46" fill="#FFFFFF" opacity="0.10"/>
  <path class="spark" style="animation-delay:0s" d="M150 81 Q150 95 164 95 Q150 95 150 109 Q150 95 136 95 Q150 95 150 81 Z" fill="#FFFFFF"/>
  <path class="spark" style="animation-delay:0.8s" d="M1060 64 Q1060 80 1076 80 Q1060 80 1060 96 Q1060 80 1044 80 Q1060 80 1060 64 Z" fill="#FFFFFF"/>
  <path class="spark" style="animation-delay:1.6s" d="M250 195 Q250 205 260 205 Q250 205 250 215 Q250 205 240 205 Q250 205 250 195 Z" fill="#FFFFFF"/>
  <path class="spark" style="animation-delay:2.2s" d="M980 189 Q980 200 991 200 Q980 200 980 211 Q980 200 969 200 Q980 200 980 189 Z" fill="#FFFFFF"/>
  <path class="spark" style="animation-delay:1.2s" d="M600 29 Q600 38 609 38 Q600 38 600 47 Q600 38 591 38 Q600 38 600 29 Z" fill="#FFFFFF"/>
  <g filter="url(#shadow)">
  <text class="title rise" x="600" y="128" text-anchor="middle" dominant-baseline="middle">Rotsy Mandrindra</text>
  <g class="rise2"><rect x="315" y="166" width="570" height="48" rx="24" fill="#FFFFFF" fill-opacity="0.18" stroke="#FFFFFF" stroke-opacity="0.35"/>
  <text class="subtitle" x="600" y="191" text-anchor="middle" dominant-baseline="middle">Fullstack Developer · Symfony &amp; React</text></g>
