    <linearGradient id="accent" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0" spreadMethod="repeat"><stop offset="0" stop-color="#06B6D4"/><stop offset="0.33" stop-color="#8B5CF6"/><stop offset="0.66" stop-color="#EC4899"/><stop offset="1" stop-color="#06B6D4"/></linearGradient>
    <clipPath id="body"><path d="M0 236 Q150 222 300 236 T600 236 T900 236 T1200 236 L1200 0 L0 0 Z"/></clipPath>
    <filter id="shadow" x="-10%" y="-30%" width="120%" height="160%">
